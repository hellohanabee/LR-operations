function dash(){const L=S.orders.filter(o=>o.date===S.date).sort((a,b)=>a.no<b.no?-1:1),live=L.filter(o=>o.status!=='Cancelled'),c=s=>live.filter(o=>o.status===s).length,A=alerts(),W=S.orders.filter(o=>pend(o).length&&!['Cancelled','Billed'].includes(o.status)).sort((a,b)=>a.date<b.date?-1:1);

 <div class="kpis"><div class="kpi"><b>${live.length}</b><span>Orders for ${dfmt(S.date)}</span></div><div class="kpi"><b>${c('New')}</b><span>New</span></div><div class="kpi"><b>${c('Confirmed')}</b><span>Confirmed</span></div><div class="kpi"><b>${c('Packed')}</b><span>Ready for accounts</span></div><div class="kpi"><b>${c('Billed')}</b><span>Billed</span></div><div class="kpi"><b>${live.filter(o=>pend(o).length).length}</b><span>Awaiting purchase</span></div><div class="kpi"><b>${live.reduce((s,o)=>s+nBox(o),0)}</b><span>Boxes</span></div>${has('ops')?'':`<div class="kpi"><b>${inr(live.reduce((s,o)=>s+tot(o).t,0))}</b><span>Value</span></div>`}</div>

function orders(){let L=[...S.orders].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:a.no<b.no?1:-1);const q=S.q.toLowerCase();if(q)L=L.filter(o=>(o.no+o.customer+(o.place||'')).toLowerCase().includes(q));if(S.st)L=L.filter(o=>o.status===S.st);
 return`<div class="top"><h2>Orders</h2>${canOrder()?'<button class="btn" data-a="new">+ New order</button>':''}</div><div class="row" style="margin-bottom:14px"><input id="q" placeholder="Search order no, customer, place" value="${e(S.q)}" style="max-width:340px"><select id="st" style="width:auto"><option value="">All statuses</option>${[...STAT,'Cancelled'].map(s=>`<option ${S.st===s?'selected':''}>${s}</option>`).join('')}</select><small style="color:var(--mut)">Last 45 days and upcoming</small></div><div class="panel">${rows(L.slice(0,150),'No matching orders.')}</div>`}

 <div class="panel"><h3>Business details (printed on bills)</h3><div class="f" style="padding:14px 16px"><div class="g2"><label>Business name<input id="s1" value="${e(S.cfg.name)}"></label><label>Phone<input id="s2" value="${e(S.cfg.phone)}"></label></div><label>Address<input id="s3" value="${e(S.cfg.addr)}"></label><div class="g2"><label>UPI ID (used for the QR code)<input id="s4" value="${e(S.cfg.upi)}"></label><label>Default box charge ₹<input id="s5" type="number" value="${S.cfg.box}"></label></div><label>Bank details (optional)<input id="s6" value="${e(S.cfg.bank||'')}" placeholder="Bank, account no, IFSC, branch"></label><button class="btn" style="justify-self:start" data-a="ss">Save details</button></div></div><div class="panel"><h3>Customers · ${S.cust.length}</h3>${S.cust.sort((a,b)=>a.name<b.name?-1:1).map(c=>`<div class="ar" style="border-color:var(--line);cursor:pointer" data-a="cust" data-id="${c.id}"><div><b>${e(c.name)}</b><br><small style="color:var(--mut)">${e(c.place||'')} ${c.phone?'· '+e(c.phone):''}</small></div><small>Box ${inr(c.box)} · Transport ${inr(c.tr)}</small></div>`).join('')||'<div class="empty">No customers yet.</div>'}</div>`}

function open(id){const o=S.orders.find(x=>x.id===id);if(!o)return;S.cur=o;const t=tot(o),ed=canOrder()&&o.status==='New',late=canOrder()&&o.status==='Confirmed',fin=o.status==='Packed'||o.status==='Billed',tf=tot(o,1),nx=o.status!=='Cancelled';

 ${(o.status!=='New'&&nx)||o.boxes?.length?`<h3 style="margin-top:18px">Packing</h3>${canPack()&&o.status==='Confirmed'?`<p style="margin:4px 0;color:var(--mut);font-size:13px">Paste the WhatsApp list, or type one box per line: <i>1. CHRY RED 10, EMMA 5</i></p><textarea id="bx" rows="5">${(o.boxes||[]).map(b=>b.l.map(x=>x.v+' '+x.q).join(', ')).join('\n')}</textarea><div class="row" style="margin-top:8px"><button class="btn sec sm" data-a="sb" data-id="${o.id}">Save boxes</button><button class="btn sm" data-a="pd" data-id="${o.id}">Mark packing done</button></div>`:(o.boxes||[]).map((b,i)=>`<div class="tl"><b>Box ${i+1}</b> ${b.l.map(x=>e(x.v)+' '+x.q).join(', ')}</div>`).join('')||'<small style="color:var(--mut)">Not packed yet.</small>'}${o.boxes?.length?`<div class="warn" style="${check(o)==='Matches order'?'background:#E3F3E7;color:#1B6B30':''}">Packing check: ${e(check(o))}</div>`:''}`:''}
 ${has('ops')?'':`<div class="sum"><div><span>Flowers ${fin?'(packed)':''}</span><span>${inr(fin?tf.fl:t.fl)}</span></div><div><span>Boxes ${t.n} × ${inr(o.boxRate)}</span><span>${inr(t.bx)}</span></div><div><span>Transport</span><span>${inr(t.tr)}</span></div><div class="t"><span>Total</span><span>${inr(fin?tf.t:t.t)}</span></div></div>`}
 <div class="row" style="margin:10px 0">${canOrder()&&o.status==='New'?`<button class="btn" data-a="cf" data-id="${o.id}">Confirm order</button>`:''}${canBill()&&o.status==='Packed'?`<button class="btn" data-a="bd" data-id="${o.id}">Mark billed</button>`:''}${canOrder()&&nx&&o.status!=='Billed'?`<button class="btn dng" data-a="cx" data-id="${o.id}">Cancel order</button>`:''}${!has('ops')&&o.status!=='New'&&nx?`<button class="btn sec" data-a="pr" data-id="${o.id}">Print ${fin?'final bill':'estimate'}</button>`:''}</div>
 <div class="row" style="margin-bottom:10px">${o.status!=='New'&&nx?`<button class="btn sec sm" data-a="pp" data-id="${o.id}">Print packing sheet</button>`:''}</div><h3>History</h3>${(o.timeline||[]).slice().reverse().map(x=>`<div class="tl"><b>${e(x.e)}</b><br>${e(x.by)} · ${new Date(x.t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>`).join('')}`)}

function custForm(id){const c=S.cust.find(x=>x.id===id)||{};modal(`<h2>${id?'Edit':'New'} customer</h2><div class="f" style="margin-top:12px"><label>Name<input id="c1" value="${e(c.name)}"></label><div class="g2"><label>Place<input id="c2" value="${e(c.place)}"></label><label>Phone<input id="c3" value="${e(c.phone)}"></label></div><div class="g2"><label>Logistics handover<input id="c4" value="${e(c.log)}"></label><label>Name on box<input id="c5" value="${e(c.boxName)}"></label></div><div class="g2"><label>Box charge ₹/box<input id="c6" type="number" value="${c.box??S.cfg.box}"></label><label>Transport ₹/box<input id="c7" type="number" value="${c.tr??0}"></label></div><label>Special rates ₹/bunch (one per line: VARIETY rate)<textarea id="c8" rows="3">${Object.entries(c.rates||{}).map(([k,v])=>k+' '+v).join('\n')}</textarea></label><div class="row"><button class="btn" data-a="sc" data-id="${id||''}">Save customer</button><button class="btn sec" data-a="x2">Cancel</button></div></div>`,1)}

const inR=()=>S.orders.filter(o=>o.date>=(S.rf||addD(ymd(new Date()),-30))&&o.date<=(S.rt||ymd(new Date())));
